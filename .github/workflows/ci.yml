name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` makes CI fail if pnpm-lock.yaml is out of sync.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate. This was non-blocking while the `eslint-plugin-react-hooks`
      # v7 rule cleanup was outstanding; that cleanup landed in #109 and lint is
      # clean on main, so the exception is gone.
      - name: Lint
        run: pnpm lint

      # `tsc -b` (no emit) catches all type errors across the project. Faster
      # than the full `pnpm build` and skips the bundle step.
      - name: Type check
        run: pnpm exec tsc -b

      # The real-bag fixtures aren't in CI (`test_files/` is gitignored), so
      # those test suites skip themselves. The synthetic in-memory MCAPs and
      # the committed sample bag (`public/sample-bags/tour.mcap`) carry the
      # coverage on CI. 600+ active tests; under 30 s wall time.
      - name: Run tests
        run: pnpm test

      # cli/bundle is committed so the GitHub Action needs no install step. A
      # source change that forgot to rebuild it would ship a stale CLI.
      - name: CLI bundle is up to date
        run: |
          pnpm build:cli
          git diff --exit-code -- cli/bundle

  # The logic suite above runs in Node and never mounts React, so it cannot see
  # render-time failures. That is not hypothetical: a Zustand selector
  # returning a fresh `[]` on every call caused an infinite render loop that
  # passed type-check, lint, and all 749 tests, and only froze the app when
  # someone clicked "Try a sample bag". This job mounts the real built bundle
  # in a browser and fails on console/page errors.
  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    # Normal runs take about 3 minutes; anything near this is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only. WebGL under SwiftShader is enough for a "does not crash"
      # check, and the smoke test makes no pixel assertions, so there is no
      # reason to pay for the other browsers.
      #
      # The apt step inside `--with-deps` has been seen to stall on hosted
      # runners for 20+ minutes with no output, before a single test runs.
      # Bound each attempt and retry once, so a stall costs 5 minutes and a
      # re-run instead of an hour-long hung job.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            if timeout 300 pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "Playwright install attempt $attempt failed or timed out"
          done
          exit 1

      # `playwright.config.ts` starts `pnpm build && pnpm preview` itself as
      # the webServer, so this step only has to run the spec.
      - name: Run smoke test
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # The e2e run above built dist/, so the size check needs no second build.
      - name: Bundle budget
        run: pnpm check:bundle
